name: Seyir
options:
  bundleIdPrefix: com.swest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # Mac'te kendi Team ID'ni yaz (ya da Xcode'dan seç)
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Seyir:
    type: application
    platform: iOS
    sources:
      - Ortak
      - Uygulama
    dependencies:
      - target: SeyirWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swest.seyir
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Seyir
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

  SeyirWidget:
    type: app-extension
    platform: iOS
    sources:
      - Ortak
      - Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swest.seyir.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Seyir
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
