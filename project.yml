name: Ilerleme
options:
  bundleIdPrefix: com.swest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # Mac'te kendi Team ID'ni yaz (ya da Xcode'dan seç)
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Ilerleme:
    type: application
    platform: iOS
    sources:
      - Ortak
      - Uygulama
    dependencies:
      - target: IlerlemeWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swest.ilerleme
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: İlerleme
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

  IlerlemeWidget:
    type: app-extension
    platform: iOS
    sources:
      - Ortak
      - Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swest.ilerleme.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: İlerleme
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
