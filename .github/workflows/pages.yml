name: Web yayını

# Web/ klasörünü GitHub Pages'e yayınlıyor. Derleme adımı yok — dosyalar
# olduğu gibi gidiyor, çünkü site zaten düz HTML/CSS/JS.

on:
  push:
    branches: [ main ]
    paths:
      - 'Web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın koşsun; yarıda kalanı iptal etme, bitmesini bekle.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Pages'i hazırla
        uses: actions/configure-pages@v5

      - name: Web klasörünü paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: Web

      - name: Yayınla
        id: dagitim
        uses: actions/deploy-pages@v4
